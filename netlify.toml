# SITO OFFLINE (beta sospesa)
# Netlify pubblica solo la pagina "Sito non disponibile" della cartella offline/.
# Il sito completo resta nella cartella app/ (e sul branch main).
# Per rimetterlo online: annullare il commit "Take the Netlify beta offline"
# oppure ripristinare la configurazione qui sotto.
#
# [build]
#   base = "app"
#   command = "npm run build"
#   publish = ".next"
# [build.environment]
#   NODE_VERSION = "22"
#   NEXT_TELEMETRY_DISABLED = "1"
# [[plugins]]
#   package = "@netlify/plugin-nextjs"

[build]
  base = "offline"
  publish = "."
  command = "echo 'Sito offline'"
